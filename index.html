<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101b35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Together Adventure</title><style>*{box-sizing:border-box}body{margin:0;background:#101b35;color:white;font-family:system-ui;overflow:hidden}header{height:58px;display:flex;align-items:center;justify-content:space-around;background:#182747;font-weight:700}button{border:0;border-radius:12px;padding:12px;background:#f7bd52;color:#17233c;font-weight:800;touch-action:none}canvas{display:block;width:100vw;height:calc(100dvh - 148px);background:#6cb9d4}footer{height:90px;display:flex;align-items:center;justify-content:space-around;background:#182747}footer button{min-width:64px;font-size:23px}#msg{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#17233cdd;padding:9px 15px;border-radius:12px;text-align:center;pointer-events:none;white-space:nowrap}</style></head><body><header><span>❤️ Together Adventure</span><span id="level">Level 1 / 100</span><button id="swap">Switch Hero</button></header><canvas id="game"></canvas><div id="msg">Collect both stars ⭐ then reach the gate 🚪</div><footer><button id="left">◀</button><button id="jump">⬆ Jump</button><button id="right">▶</button><button id="restart">↻</button></footer><script src="game.js"></script></body></html>
